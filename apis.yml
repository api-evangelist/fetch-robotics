name: Fetch Robotics
description: >-
  Fetch Robotics is a provider of autonomous mobile robots (AMRs) for the manufacturing,
  distribution, and fulfillment industries, enabling customers to optimize warehouse and
  material-handling workflows through robotic automation. Its Fetch and Freight robots are
  programmed through a ROS (Robot Operating System) interface — standard ROS topics, services,
  and actions conforming to ROS Enhancement Proposals (REPs) — rather than an HTTP/REST API, and
  the first-party client, driver, and simulation libraries are published as open source in the
  fetchrobotics GitHub organization. Fetch Robotics was acquired by Zebra Technologies in August
  2021 for approximately $290M; fetchrobotics.com now redirects to Zebra and the autonomous-mobile-robot
  product line is being wound down (2025-2026), though the open-source ROS packages remain available.
